[project]
name = "xiaoheihe-mcp"
version = "0.2.0"
description = "小黑盒社区 MCP Server — 只读搜索、浏览与登录态管理"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "foxlesbiao" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.scripts]
xiaoheihe = "xiaoheihe_mcp.cli:cli"
xiaoheihe-mcp = "xiaoheihe_mcp.server:main"

[tool.setuptools.packages.find]
include = ["xiaoheihe_mcp*"]
